name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # реліз і файли до нього
      packages: write # образ на GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: тести
        run: go test -race ./...

      - name: версія в server.json збігається з тегом
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(jq -r .version server.json)"
          image="$(jq -r '.packages[0].identifier' server.json)"
          if [ "$got" != "$want" ] || [ "$image" != "ghcr.io/grengojbo/keycrm-mcp-go:$want" ]; then
            echo "::error::server.json: version=$got, identifier=$image; очікується $want"
            exit 1
          fi

      - name: нотатки релізу з CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::У CHANGELOG.md немає розділу [${TAG#v}]"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
