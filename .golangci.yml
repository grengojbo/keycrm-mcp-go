version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - goheader
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    goheader:
      # Кожен .go файл має починатися з SPDX-ідентифікатора ліцензії.
      template: "SPDX-License-Identifier: AGPL-3.0-only"
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
