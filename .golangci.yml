version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - goheader
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    goheader:
      # Кожен .go файл має починатися з SPDX-ідентифікатора ліцензії.
      template: "SPDX-License-Identifier: AGPL-3.0-only"
  exclusions:
    generated: lax
    rules:
      # Інструменти передають відповідь згенерованого клієнта прямо в
      # listing.Raw / listing.Object, які читають і закривають тіло; bodyclose
      # не простежує закриття в іншому пакеті. Що кожен виклик API йде через
      # них, перевіряє TestToolsCloseResponses (internal/tools/contract_test.go).
      - path: ^internal/tools/
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
