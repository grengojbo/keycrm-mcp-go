# Виправлення специфікації keyCRM, які застосовує oapi-codegen після розбору api.yaml.
# Сам api.yaml лишається байт-у-байт копією https://docs.keycrm.app/api.yaml.
overlay: 1.0.0
info:
  title: keycrm-mcp-go — виправлення api.yaml
  version: 1.0.0
actions:
  # У специфікації обмеження кількості елементів масиву записане як `maximum`
  # (діє лише на числа) замість `maxItems`.
  - target: $.paths['/order/import'].post.requestBody.content['application/json'].schema.properties.orders.maximum
    remove: true
  - target: $.paths['/order/import'].post.requestBody.content['application/json'].schema.properties.orders
    update:
      maxItems: 50
  - target: $.paths['/products/import'].post.requestBody.content['application/json'].schema.properties.products.maximum
    remove: true
  - target: $.paths['/products/import'].post.requestBody.content['application/json'].schema.properties.products
    update:
      maxItems: 100
  - target: $.paths['/products/{productId}/offers'].post.requestBody.content['application/json'].schema.properties.offers.maximum
    remove: true
  - target: $.paths['/products/{productId}/offers'].post.requestBody.content['application/json'].schema.properties.offers
    update:
      maxItems: 100
  - target: $.paths['/offers'].put.requestBody.content['application/json'].schema.properties.offers.maximum
    remove: true
  - target: $.paths['/offers'].put.requestBody.content['application/json'].schema.properties.offers
    update:
      maxItems: 10000
  - target: $.paths['/offers/stocks'].put.requestBody.content['application/json'].schema.properties.stocks.maximum
    remove: true
  - target: $.paths['/offers/stocks'].put.requestBody.content['application/json'].schema.properties.stocks
    update:
      maxItems: 10000
